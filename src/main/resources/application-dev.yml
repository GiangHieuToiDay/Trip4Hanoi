spring:

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/trip4hanoi
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}


gemini:
  api:
    key: ${GEMINI_API_KEY}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


openapi:
  service:
    api-docs: TRIP4-HANOI
    title: TRIP4 HA NOI APP API Document
    version: 1.0.0
    server: http://localhost:8080


app:
  init:
    admin-password: ${ADMIN_PASSWORD:123456}
    staff-password: ${STAFF_PASSWORD:123456}
#  baseurl: http://192.168.1.239:8080
  baseurl: http://localhost:8080
google:
  client-id: ${GOOGLE_CLIENT_ID}


weather:
  api:
    key: ${API_KEY_OPEN_WEATHER}
    url: "https://api.openweathermap.org/data/2.5/weather"


payos:
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}




